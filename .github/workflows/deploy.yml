name: Deploy Quartz to GitHub Pages
 
on:
  push:
    branches:
      - main
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout our clean repository (has content/ and quartz.config.yaml)
      - uses: actions/checkout@v4
        with:
          path: my-garden
          fetch-depth: 0
 
      # 2. Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
 
      # 3. Clone official Quartz repository
      - name: Clone Quartz
        run: git clone https://github.com/jackyzha0/quartz.git quartz-core
 
      # 4. Copy our notes and config into Quartz core
      - name: Prepare Quartz content
        run: |
          # Remove default Quartz content
          rm -rf quartz-core/content/*
          # Copy our content
          cp -r my-garden/content/* quartz-core/content/
          # Copy our config
          cp my-garden/quartz.config.yaml quartz-core/quartz.config.yaml
 
      # 5. Install dependencies and build Quartz
      - name: Build Quartz
        run: |
          cd quartz-core
          npm ci
          npm run install-plugins
          npx quartz build
 
      # 6. Upload artifact for Pages deployment
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-core/public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
