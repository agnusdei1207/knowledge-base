name: Deploy Quartz to GitHub Pages
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: my-garden
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Quartz v5 currently breaks on newer 22.x patch lines during plugin install.
          node-version: 22.16.0

      - name: Clone Quartz v5
        run: git clone --depth 1 --branch v5 https://github.com/jackyzha0/quartz.git quartz-core

      - name: Prepare Quartz content
        run: |
          rm -rf quartz-core/content/*
          cp -r my-garden/content/. quartz-core/content/
          cp my-garden/quartz.config.yaml quartz-core/quartz.config.yaml

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22.16.0-quartz-v5

      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: quartz-core/.quartz/plugins
          key: ${{ runner.os }}-plugins-v5

      - name: Install dependencies
        working-directory: quartz-core
        run: npm ci

      - name: Install Quartz plugins
        working-directory: quartz-core
        run: npm run install-plugins

      - name: Build
        working-directory: quartz-core
        run: npx quartz build --baseDir /knowlegebase

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-core/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
