name: Validate Repository Structure

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: "validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          required=(
            "package.json"
            "package-lock.json"
            "quartz.config.yaml"
            "quartz.lock.json"
            "scripts/knowledgebase_mcp_server.py"
            "content/index.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              missing=1
            else
              echo "✅ Found:   $f"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Validate shell scripts
        run: |
          find scripts -name "*.sh" | while read -r f; do
            bash -n "$f" && echo "✅ $f" || { echo "❌ $f"; exit 1; }
          done

      - name: Validate YAML files
        run: |
          pip install --quiet pyyaml
          python3 -c "
          import yaml, sys, pathlib
          files = ['quartz.config.yaml']
          files += [str(p) for p in pathlib.Path('.github/workflows').glob('*.yml')]
          errs = []
          for f in files:
              try:
                  yaml.safe_load(open(f)); print(f'✅ {f}')
              except Exception as e:
                  print(f'❌ {f}: {e}'); errs.append(f)
          sys.exit(len(errs))
          "

      - name: Validate Python syntax
        run: python3 -m py_compile scripts/knowledgebase_mcp_server.py && echo "✅ MCP server"
