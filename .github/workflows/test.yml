name: Validate Repository Structure

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. 필수 파일 존재 확인 ──────────────────────────────────────────
      - name: Check required files exist
        run: |
          required=(
            "quartz.config.yaml"
            "docker-compose.yml"
            "scripts/build-quartz.sh"
            "scripts/serve-quartz.sh"
            "scripts/knowledgebase_mcp_server.py"
            "docker/knowledgebase-mcp.Dockerfile"
            "content/index.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              missing=1
            else
              echo "✅ Found:   $f"
            fi
          done
          [ "$missing" -eq 0 ] || { echo "Required files are missing!"; exit 1; }

      # ── 2. 셸 스크립트 문법 검사 ────────────────────────────────────────
      - name: Validate shell scripts syntax
        run: |
          find scripts -name "*.sh" | while read -r f; do
            bash -n "$f" && echo "✅ Syntax OK: $f" || { echo "❌ Syntax error: $f"; exit 1; }
          done

      # ── 3. YAML 문법 검사 ───────────────────────────────────────────────
      - name: Validate YAML files
        run: |
          pip install --quiet pyyaml
          python3 - <<'EOF'
          import yaml, sys, pathlib

          targets = [
              "quartz.config.yaml",
              "docker-compose.yml",
          ]
          targets += [str(p) for p in pathlib.Path(".github/workflows").glob("*.yml")]

          errors = []
          for path in targets:
              try:
                  yaml.safe_load(open(path))
                  print(f"✅ Valid YAML: {path}")
              except Exception as e:
                  print(f"❌ Invalid YAML: {path}: {e}")
                  errors.append(path)

          if errors:
              print(f"\n{len(errors)} YAML file(s) have errors!")
              sys.exit(1)
          EOF

      # ── 4. Python MCP 서버 문법 검사 ────────────────────────────────────
      - name: Validate Python MCP server syntax
        run: |
          python3 -m py_compile scripts/knowledgebase_mcp_server.py \
            && echo "✅ Python syntax OK: knowledgebase_mcp_server.py" \
            || { echo "❌ Python syntax error"; exit 1; }

      - name: All checks passed
        run: echo "🎉 Repository structure is valid!"
