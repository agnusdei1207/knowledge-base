name: Build Verification Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Quartz source
        id: cache-quartz-src
        uses: actions/cache@v4
        with:
          path: .quartz-src
          key: quartz-src-v5-${{ hashFiles('quartz.config.yaml') }}
          restore-keys: |
            quartz-src-v5-

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: .quartz-src/.npm-cache
          key: quartz-npm-v5-${{ hashFiles('.quartz-src/package-lock.json') }}
          restore-keys: |
            quartz-npm-v5-

      - name: Verify Quartz build
        env:
          USE_DOCKER: "false"
          NODE_OPTIONS: "--max-old-space-size=4096"
          QUARTZ_SRC_CACHE: ".quartz-src"
          NPM_CACHE_DIR: ".quartz-src/.npm-cache"
          QUARTZ_SRC_CACHED: ${{ steps.cache-quartz-src.outputs.cache-hit }}
        run: bash scripts/build-quartz.sh .quartz-build/public
