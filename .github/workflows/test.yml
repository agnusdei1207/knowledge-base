name: Validate Repository Structure

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check required files exist
        run: |
          required=(
            "package.json"
            "package-lock.json"
            "config.toml"
            "templates/base.html"
            "static/assets/css/style.css"
            "scripts/knowledgebase_mcp_server.py"
            "scripts/build_zola_data.py"
            "content/_index.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              missing=1
            else
              echo "Found:   $f"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Validate shell scripts
        run: |
          find scripts -name "*.sh" | while read -r f; do
            bash -n "$f" && echo "$f"
          done

      - name: Validate config and workflows
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, tomllib, yaml
          tomllib.load(open("config.toml", "rb"))
          for f in pathlib.Path(".github/workflows").glob("*.yml"):
              yaml.safe_load(open(f, encoding="utf-8"))
          PY

      - name: Validate Python syntax
        run: python3 -m py_compile scripts/*.py
