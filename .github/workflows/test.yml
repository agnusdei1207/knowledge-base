name: Build Verification Test
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run all build tests
        env:
          USE_DOCKER: "false"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: bash scripts/test-all.sh
