# clients.yaml 스키마 (참고용, 빌드 시 제외됨)
$schema: http://json-schema.org/draft-07/schema#
type: object
required: [clients]
properties:
  clients:
    type: array
    items:
      type: object
      required: [id, name, domain, status, mrr, contact, addedAt]
      properties:
        id: { type: string, pattern: "^[a-z0-9-]+$" }
        name: { type: string }
        domain: { type: string, description: "보안/AX/컨설팅 등" }
        status:
          type: string
          enum: [active, pending, lost, churned]
        mrr: { type: number, minimum: 0, description: "USD/월" }
        contact: { type: string }
        addedAt: { type: string, format: date }
        notes: { type: string }
