<!DOCTYPE html>
<html lang="ko-KR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Study Hub</title>
  <meta name="description" content="페이지를 찾을 수 없습니다.">
  <style>
    :root {
      --bg: #191715;
      --card: #2D2A27;
      --text: #D4CEC5;
      --muted: #8C867E;
      --accent: #E2A06E;
      --border: #3B352F;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(circle at top, #2D2A27 0%, #191715 58%);
      color: var(--text);
      font-family: "Source Sans 3", system-ui, sans-serif;
    }
    main {
      width: min(640px, 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      background: rgba(45, 42, 39, 0.88);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 2.2rem;
      color: var(--accent);
    }
    p {
      margin: 0.5rem 0;
      line-height: 1.6;
    }
    .muted { color: var(--muted); }
    a {
      display: inline-block;
      margin-top: 1.25rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>요청한 페이지를 찾을 수 없습니다.</p>
    <p class="muted">주소가 변경되었거나 삭제되었을 수 있습니다.</p>
    <a href="/study/">홈으로 이동</a>
  </main>
</body>
</html>
