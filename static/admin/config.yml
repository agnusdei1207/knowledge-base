local_backend: true
backend:
  name: github
  repo: agnusdei1207/knowledge-base
  branch: main
  open_authoring: true

publish_mode: editorial_workflow
site_url: https://agnusdei1207.github.io/knowledge-base
display_url: https://agnusdei1207.github.io/knowledge-base
logo_url: https://agnusdei1207.github.io/knowledge-base/icon.png

media_folder: content/assets/uploads
public_folder: /knowledge-base/assets/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: work
    label: "🏢 Work Documents"
    label_singular: "Work Document"
    folder: content/work
    create: true
    extension: md
    format: yaml-frontmatter
    preview_path: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    editor:
      preview: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Tags, name: tags, widget: list, required: false }
      - label: Department
        name: department
        widget: select
        required: false
        options:
          - Business
          - R&D
          - Development
          - Operations
          - Sales
      - { label: Draft, name: draft, widget: boolean, required: false, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: personal
    label: "🏠 Personal Documents"
    label_singular: "Personal Document"
    folder: content/personal
    create: true
    extension: md
    format: yaml-frontmatter
    preview_path: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    editor:
      preview: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, required: false, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: study
    label: "🎓 Study & R&D Documents"
    label_singular: "Study Document"
    folder: content/study
    create: true
    extension: md
    format: yaml-frontmatter
    preview_path: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    editor:
      preview: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, required: false, default: false }
      - { label: Body, name: body, widget: markdown }

