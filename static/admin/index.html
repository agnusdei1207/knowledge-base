<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Knowledgebase CMS</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f1e8;
        color: #1f2328;
      }

      .notice {
        box-sizing: border-box;
        width: 100%;
        padding: 12px 16px;
        border-bottom: 1px solid #d0c6b5;
        background: #efe6d5;
        font-size: 14px;
        line-height: 1.5;
      }

      .notice strong {
        font-weight: 700;
      }

      .notice a {
        color: #854d0e;
      }
    </style>
  </head>
  <body>
    <div class="notice">
      <strong>편집기 상태:</strong> `/admin` 화면은 배포되어 있습니다.
      GitHub Pages에서 실제 로그인/저장을 하려면 GitHub OAuth 인증 백엔드가 추가로 필요합니다.
      아직 인증 서버가 없으면 GitHub 수정 링크를 사용하세요.
      <a href="/knowledge-base/decap-cms">설명 문서 보기</a>
    </div>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
