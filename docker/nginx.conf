server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 302 /study/;
  }

  location = /study {
    return 301 /study/;
  }

  location ^~ /study/ {
    rewrite ^/study/(.*)$ /$1 break;
    try_files $uri $uri.html $uri/ $uri/index.html /404.html;
  }
}
