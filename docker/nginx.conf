server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 302 /knowledge-base/;
  }

  location = /knowledge-base {
    return 301 /knowledge-base/;
  }

  location ^~ /knowledge-base/ {
    rewrite ^/knowledge-base/(.*)$ /$1 break;
    try_files $uri $uri.html $uri/ $uri/index.html /404.html;
  }
}
