services:
  quartz-server:
    image: node:24-alpine
    container_name: knowledgebase-quartz
    ports:
      - "8080:8080"
      - "3001:3001"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      - PORT=8080
      - WS_PORT=3001
      - BASE_DIR=/
      - WORKSPACE=/workspace
      - NODE_OPTIONS=--max-old-space-size=8192
    entrypoint: ["/bin/sh", "/workspace/scripts/serve-quartz.sh"]
    restart: unless-stopped

  knowledgebase-mcp:
    build:
      context: .
      dockerfile: docker/knowledgebase-mcp.Dockerfile
    container_name: knowledgebase-mcp
    ports:
      - "8090:8090"
    volumes:
      - ./content:/workspace/content:ro
    environment:
      - CONTENT_DIR=/workspace/content
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8090
    restart: unless-stopped
