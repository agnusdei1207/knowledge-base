services:
  quartz-server:
    image: node:alpine
    container_name: quartz-local-wiki
    ports:
      - "8080:8080"
      - "3001:3001"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      - PORT=8080
      - WS_PORT=3001
      - BASE_DIR=/
      - WORKSPACE=/workspace
    entrypoint:
      - /bin/sh
      - /workspace/scripts/serve-quartz.sh
    restart: unless-stopped
