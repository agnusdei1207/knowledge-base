services:
  quartz-server:
    image: node:alpine
    container_name: quartz-local-wiki
    ports:
      - "8080:8080"
      - "3001:3001"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      - PORT=8080
      - WS_PORT=3001
      - BASE_DIR=/
      - WORKSPACE=/workspace
    entrypoint:
      - /bin/sh
      - /workspace/scripts/serve-quartz.sh
    restart: unless-stopped

  knowledgebase-mcp:
    build:
      context: .
      dockerfile: docker/knowledgebase-mcp.Dockerfile
    container_name: knowledgebase-mcp
    ports:
      - "8090:8090"
    volumes:
      - ./:/workspace:ro
    environment:
      - CONTENT_DIR=/workspace/content
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8090
      - KB_BASE_URL=http://localhost:8080
    restart: unless-stopped
