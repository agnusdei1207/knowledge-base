{% extends "base.html" %}

{% block header_title %}Study Hub{% endblock header_title %}

{% block content %}
<div class="home-stack">
    <div class="home-header">
        <p class="home-description">컴퓨터시스템응용기술사(CSPE) 합격 전용 — 전략·기출·답안 템플릿·핵심 키워드</p>
    </div>

    <div class="subject-grid">
        <a class="subject-card" href="{{ get_url(path='/exam/cs/') }}">
            <span class="subject-num">PE</span>
            <span class="subject-name">시험 준비</span>
            <p class="subject-desc">전략·기출(120~138회)·빈도·모범답안 템플릿</p>
        </a>
        <a class="subject-card" href="{{ get_url(path='/cspe/') }}">
            <span class="subject-num">KW</span>
            <span class="subject-name">키워드 노트</span>
            <p class="subject-desc">8개 대영역 출제동향 키워드 — 암기용 + 답안용</p>
        </a>
        <a class="subject-card" href="{{ get_url(path='/exam/cs/integrated-strategy/') }}">
            <span class="subject-num">ST</span>
            <span class="subject-name">통합 학습 전략</span>
            <p class="subject-desc">기출 분석·과목 교차·타임라인</p>
        </a>
    </div>
</div>
{% endblock content %}
